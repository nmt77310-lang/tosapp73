<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Planner</title>

<style>
  :root {
    --bg: #f4f4f4;
    --card: #ffffff;
    --text: #000;
  }
  body.dark {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #fff;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    margin: 0;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  input, button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
  }
  .todo {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
  }
</style>
</head>

<body>
<button onclick="toggleDark()">🌙 ダークモード</button>

<div class="card">
  <h2>前日入力（最大3つ）</h2>
  <div id="inputs"></div>
  <button onclick="savePlan()">保存</button>
</div>

<div class="card">
  <h2>今日のTo Do</h2>
  <div id="todayTodos"></div>
  <p>今日の達成率：<span id="todayRate">0%</span></p>
</div>

<div class="card">
  <h2>統計</h2>
  <p>累積達成数：<span id="totalDone">0</span></p>
  <p>全体達成率：<span id="totalRate">0%</span></p>
</div>

<script>
const planKey = "plan";
const statKey = "stats";

const inputs = document.getElementById("inputs");
for(let i=0;i<3;i++){
  inputs.innerHTML += `
    <input placeholder="To Do ${i+1}" id="todo${i}">
    <input type="time" id="time${i}">
    <input placeholder="Want To Do ${i+1}" id="want${i}">
  `;
}

function savePlan(){
  const plan = [];
  for(let i=0;i<3;i++){
    const text = document.getElementById(`todo${i}`).value;
    const time = document.getElementById(`time${i}`).value;
    const want = document.getElementById(`want${i}`).value;
    if(text && time){
      plan.push({text, time, want, done:false});
      setAlarm(text, time, want);
    }
  }
  localStorage.setItem(planKey, JSON.stringify(plan));
  renderToday();
}

function renderToday(){
  const area = document.getElementById("todayTodos");
  area.innerHTML = "";
  const plan = JSON.parse(localStorage.getItem(planKey)) || [];
  let done = 0;

  plan.forEach((t,i)=>{
    if(t.done) done++;
    area.innerHTML += `
      <div class="todo">
        <span onclick="toggleDone(${i})">${t.text} (${t.time})</span>
        <input type="checkbox" ${t.done?"checked":""}>
      </div>
    `;
  });

  document.getElementById("todayRate").textContent =
    plan.length ? Math.round(done/plan.length*100)+"%" : "0%";

  updateStats(done, plan.length);
}

function toggleDone(i){
  const plan = JSON.parse(localStorage.getItem(planKey));
  plan[i].done = !plan[i].done;
  localStorage.setItem(planKey, JSON.stringify(plan));
  renderToday();
}

function updateStats(doneToday, totalToday){
  const stats = JSON.parse(localStorage.getItem(statKey)) || {done:0,total:0};
  stats.done += doneToday;
  stats.total += totalToday;
  localStorage.setItem(statKey, JSON.stringify(stats));

  document.getElementById("totalDone").textContent = stats.done;
  document.getElementById("totalRate").textContent =
    stats.total ? Math.round(stats.done/stats.total*100)+"%" : "0%";
}

function setAlarm(text, time, want){
  if(Notification.permission !== "granted"){
    Notification.requestPermission();
  }
  const now = new Date();
  const alarm = new Date();
  const [h,m] = time.split(":");
  alarm.setHours(h,m,0);

  const delay = alarm - now;
  if(delay > 0){
    setTimeout(()=>{
      new Notification("⏰ To Do アラーム",{
        body: `${text}\nWant: ${want}`
      });
    }, delay);
  }
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

renderToday();
</script>
</body>
</html>
